name: Informative preview regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: informative-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  informative-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:informative-preview
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/template-informative-multi-date-preview.spec.ts --workers=1 --reporter=line
